<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>serve · stats</title>
  <style>
    :root {
      --bg: #fafafa; --fg: #222; --muted: #666; --border: #ddd;
      --c1: #805ad5; --c2: #38a169; --c3: #3182ce; --c4: #d69e2e; --c5: #e53e3e;
      --warn-bg: #fff3cd; --warn-fg: #664d03;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a1a; --fg: #ddd; --muted: #888; --border: #333;
              --warn-bg: #3a2f00; --warn-fg: #ffd96b; }
    }
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
           background: var(--bg); color: var(--fg); margin: 0; padding: 1em 1.5em; }
    a, a:visited, a:hover, a:active { text-decoration: underline; }
    a { color: var(--fg); }
    a:visited { color: color-mix(in srgb, var(--fg), #000 25%); }
    a:hover { color: color-mix(in srgb, var(--fg), #fff 22%); }
    header { display: flex; justify-content: space-between; align-items: center;
             border-bottom: 1px solid var(--border); padding-bottom: 0.5em; }
    header h1 { font-size: 1.1em; margin: 0; }
    .windows { margin: 1em 0; }
    .windows button { padding: 0.4em 0.8em; font: inherit; margin-right: 0.4em;
                      border: 1px solid var(--border); background: transparent;
                      color: inherit; cursor: pointer; border-radius: 4px; }
    .windows button.active { background: var(--fg); color: var(--bg); }
    .cards { display: flex; gap: 1em; margin: 1em 0; flex-wrap: wrap; }
    .card { flex: 1 1 140px; padding: 0.8em 1em; border: 1px solid var(--border);
            border-radius: 6px; min-width: 130px; }
    .card .label { font-size: 0.8em; color: var(--muted); }
    .card .value { font-size: 1.4em; font-weight: 600; margin-top: 0.2em; }
    .panel { margin: 1.5em 0; }
    .panel h2 { font-size: 1em; margin: 0 0 0.5em 0; color: var(--muted); }
    .panel h3 { font-size: 0.9em; margin: 0 0 0.3em 0; color: var(--muted); font-weight: 600; }
    .lat-chart + .lat-chart { margin-top: 1.2em; }
    .chart-wrap { position: relative; }
    svg.chart { width: 100%; height: 220px; display: block;
                border: 1px solid var(--border); border-radius: 6px; }
    .chart-axis { stroke: var(--muted); stroke-width: 1; fill: none; }
    .chart-grid { stroke: var(--border); stroke-width: 1; fill: none; }
    .chart-tick-label { font: 11px sans-serif; fill: var(--muted); }
    .chart-empty { font: 12px sans-serif; fill: var(--muted); text-anchor: middle; }
    .chart-guide { stroke: var(--muted); stroke-width: 1;
                   stroke-dasharray: 3 3; display: none; pointer-events: none; }
    .chart-tip { position: absolute; display: none; pointer-events: none;
                 background: var(--bg); color: var(--fg);
                 border: 1px solid var(--border); border-radius: 4px;
                 padding: 0.5em 0.7em; font-size: 0.85em; min-width: 170px;
                 box-shadow: 0 2px 8px rgba(0,0,0,0.18); z-index: 10; }
    .chart-tip .ts { font-weight: 600; margin-bottom: 0.35em; }
    .chart-tip .row { display: flex; justify-content: space-between;
                      gap: 1em; line-height: 1.5; }
    .chart-tip .row .sw { display: inline-block; width: 0.7em; height: 0.7em;
                          margin-right: 0.4em; vertical-align: middle; }
    .chart-tip .total { border-top: 1px solid var(--border);
                        margin-top: 0.35em; padding-top: 0.35em;
                        font-weight: 600; }
    .legend { font-size: 0.85em; margin-top: 0.4em; color: var(--muted);
              display: flex; flex-wrap: wrap; gap: 0.2em 1em; }
    .legend .sw { display: inline-block; width: 0.8em; height: 0.8em;
                  margin-right: 0.2em; vertical-align: middle; }
    .sw.c1 { background: var(--c1); } .sw.c2 { background: var(--c2); }
    .sw.c3 { background: var(--c3); } .sw.c4 { background: var(--c4); }
    .sw.c5 { background: var(--c5); }
    .cbar-tip { position: fixed; }
    .cbar { display: flex; height: 0.8em; width: 100%; min-width: 80px;
            border-radius: 3px; overflow: hidden; background: var(--border);
            cursor: default; }
    .cbar span { display: block; height: 100%; }
    .cbar .c1 { background: var(--c1); } .cbar .c2 { background: var(--c2); }
    .cbar .c3 { background: var(--c3); } .cbar .c4 { background: var(--c4); }
    .cbar .c5 { background: var(--c5); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th, td { padding: 0.4em 0.6em; text-align: left;
             border-bottom: 1px solid var(--border); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .sort-controls { float: right; }
    .warn { background: var(--warn-bg); color: var(--warn-fg);
            padding: 0.5em 0.8em; border-radius: 4px; margin: 0.5em 0;
            font-size: 0.9em; }
    footer { margin-top: 2em; padding-top: 1em; border-top: 1px solid var(--border);
             font-size: 0.85em; color: var(--muted); }
    .logout { background: none; border: 1px solid var(--border); padding: 0.3em 0.8em;
              border-radius: 4px; color: inherit; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>serve · stats</h1>
    <form method="post" action="{{PREFIX}}/logout"
          style="margin:0"><button class="logout">logout</button></form>
  </header>

  <div class="windows" id="windows">
    <button data-window="1d">1 day</button>
    <button data-window="7d">7 days</button>
    <button data-window="30d">30 days</button>
    <button data-window="12m">12 months</button>
  </div>

  <section id="section-overview">
    <div class="cards" id="cards"></div>
    <div class="panel">
      <h2>Requests over time</h2>
      <div class="chart-wrap"><svg id="chart-req" class="chart"></svg><div class="chart-tip" id="tip-req"></div></div>
      <div class="legend"></div>
    </div>
    <div class="panel">
      <h2>Bytes delivered</h2>
      <div class="chart-wrap"><svg id="chart-bytes" class="chart"></svg><div class="chart-tip" id="tip-bytes"></div></div>
      <div class="legend"></div>
    </div>
  </section>

  <section id="section-performance">
    <div id="source-panels"></div>
  </section>

  <section id="section-traffic">
    <div class="panel">
      <h2>Top 30 assets
        <span class="sort-controls">
          Sort by:
          <button data-sort="bytes">bytes</button>
          <button data-sort="requests">requests</button>
        </span>
      </h2>
      <table id="assets"><thead><tr>
        <th>#</th><th>Path</th><th class="num">Requests</th><th class="num">Bytes</th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="panel" id="countries-panel" hidden>
      <h2>Top 30 countries
        <span class="sort-controls" id="country-sort">
          Sort by:
          <button data-csort="bytes">bytes</button>
          <button data-csort="requests">requests</button>
        </span>
      </h2>
      <table id="countries"><thead><tr>
        <th>#</th><th>Country</th><th class="num">Requests</th>
        <th class="num">Bytes</th><th>By class</th>
      </tr></thead><tbody></tbody></table>
      <div class="chart-tip cbar-tip" id="tip-country"></div>
    </div>
  </section>

  <section id="section-health">
    <div class="panel"><div id="health"></div></div>
  </section>

  <script>
  const PREFIX = '{{PREFIX}}';
  const fmt = {
    bytes(n) {
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    },
    int(n) { return n.toLocaleString(); }
  };

  const state = {
    window: localStorage.getItem('stats:window') || '1d',
    sort: localStorage.getItem('stats:sort') || 'bytes',
    csort: localStorage.getItem('stats:csort') || 'bytes',
  };

  function setActive(group, attr, value) {
    group.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset[attr] === value);
    });
  }

  let lastTs = null;
  let lastTsWindow = null;

  function activeClasses(points) {
    return CLASS_DIGITS.filter(cd => points.some(p => {
      const m = p.by_class[cd];
      return m && (m.requests > 0 || m.bytes > 0);
    }));
  }

  function renderLegend(panelEl, series) {
    const legend = panelEl.querySelector('.legend');
    legend.innerHTML = series.map(cd =>
      `<span><span class="sw c${cd}"></span>${cd}xx</span>`
    ).join('');
  }

  function drawCharts() {
    if (!lastTs) return;
    const series = activeClasses(lastTs.points);
    const reqPanel = document.querySelector('#chart-req').closest('.panel');
    const bytesPanel = document.querySelector('#chart-bytes').closest('.panel');
    renderLegend(reqPanel, series);
    renderLegend(bytesPanel, series);
    renderChart(reqPanel, lastTs.points, 'requests', lastTsWindow, series);
    renderChart(bytesPanel, lastTs.points, 'bytes', lastTsWindow, series);
  }

  // Fetch JSON, surfacing transport errors instead of letting r.json() blow up.
  // An expired session is answered with a redirect to /login (fetch follows it),
  // so bounce the page there rather than parsing the login HTML as JSON.
  async function getJSON(url) {
    const r = await fetch(url);
    if (r.redirected && r.url.includes(`${PREFIX}/login`)) {
      window.location.href = r.url;
      throw new Error('session expired');
    }
    if (!r.ok) throw new Error(`${url} -> ${r.status}`);
    return r.json();
  }

  async function loadOverview() {
    const [summary, ts] = await Promise.all([
      getJSON(`${PREFIX}/api/summary?window=${state.window}`),
      getJSON(`${PREFIX}/api/timeseries?window=${state.window}`),
    ]);
    renderCards(summary);
    lastTs = ts;
    lastTsWindow = state.window;
    drawCharts();
  }

  async function loadTraffic() {
    setActive(document.querySelector('#section-traffic .sort-controls'), 'sort', state.sort);
    setActive(document.querySelector('#country-sort'), 'csort', state.csort);
    const [assets, countries] = await Promise.all([
      getJSON(`${PREFIX}/api/assets?window=${state.window}&sort=${state.sort}`),
      getJSON(`${PREFIX}/api/countries?window=${state.window}&sort=${state.csort}`),
    ]);
    renderAssets(assets);
    renderCountries(countries);
  }

  async function loadHealth() {
    const health = await getJSON(`${PREFIX}/api/health`);
    renderHealth(health);
  }

  let lastLatency = null;
  async function loadPerformance() {
    lastLatency = await getJSON(`${PREFIX}/api/latency?window=${state.window}`);
    renderPerformance(lastLatency);
  }

  function ppath(metric, key) { return metric === 'total' ? `total_${key}` : `ttfb_${key}`; }

  function msfmt(v) {
    if (v == null) return '—';
    if (v < 1) return '&lt;1 ms';
    if (v < 1000) return v.toFixed(v < 10 ? 1 : 0) + ' ms';
    return (v / 1000).toFixed(2) + ' s';
  }

  // Plain-text variant for SVG axis ticks (textContent, no HTML entities).
  function msAxisFmt(v) {
    if (v === 0) return '0';
    if (v < 1000) return v.toFixed(v < 10 ? 1 : 0) + ' ms';
    return (v / 1000).toFixed(2) + ' s';
  }

  const LAT_METRICS = [
    { key: 'ttfb', label: 'TTFB' },
    { key: 'total', label: 'Total' },
  ];

  function latChartBlock(s, metric) {
    return `
      <div class="lat-chart" data-lat="${metric.key}">
        <h3>${metric.label}
          <span class="sort-controls">p50 ${msfmt(s.summary[ppath(metric.key,'p50')])} ·
          p95 ${msfmt(s.summary[ppath(metric.key,'p95')])} ·
          p99 ${msfmt(s.summary[ppath(metric.key,'p99')])}</span>
        </h3>
        <div class="chart-wrap"><svg class="chart"></svg><div class="chart-tip"></div></div>
        <div class="legend"><span><span class="sw c2"></span>p50</span>
          <span><span class="sw c3"></span>p95</span><span><span class="sw c5"></span>p99</span></div>
      </div>`;
  }

  function renderPerformance(l) {
    const wrap = document.getElementById('source-panels');
    wrap.innerHTML = l.sources.map(s => `
      <div class="panel">
        <h2>${escapeHtml(s.source)}
          <span class="sort-controls">304 ${(s.summary.not_modified_rate * 100).toFixed(1)}%</span>
        </h2>
        ${LAT_METRICS.map(m => latChartBlock(s, m)).join('')}
      </div>`).join('');
    drawPerfCharts();
  }

  const PERF_TIP_LABELS = { 2: 'p50', 3: 'p95', 5: 'p99' };

  function drawLatChart(s, blockEl, metricKey) {
    if (!blockEl) return;
    const points = s.timeseries.map(p => ({
      ts: p.ts,
      by_class: {
        2: { requests: p[ppath(metricKey,'p50')], bytes: 0 },
        3: { requests: p[ppath(metricKey,'p95')], bytes: 0 },
        5: { requests: p[ppath(metricKey,'p99')], bytes: 0 },
      },
    }));
    renderChart(blockEl, points, 'requests', state.window, [2, 3, 5], {
      labelOf: cd => PERF_TIP_LABELS[cd],
      valueFmt: msfmt,
      axisFmt: msAxisFmt,
      showTotal: false,
      stack: false,
    });
  }

  function drawPerfCharts() {
    if (!lastLatency) return;
    const panels = document.querySelectorAll('#source-panels .panel');
    lastLatency.sources.forEach((s, i) => {
      const panel = panels[i];
      if (!panel) return;
      LAT_METRICS.forEach(m =>
        drawLatChart(s, panel.querySelector(`.lat-chart[data-lat="${m.key}"]`), m.key));
    });
  }

  let perfRafPending = false;
  function schedulePerfRedraw() {
    if (perfRafPending) return;
    perfRafPending = true;
    requestAnimationFrame(() => {
      perfRafPending = false;
      drawPerfCharts();
    });
  }

  async function loadAll() {
    setActive(document.getElementById('windows'), 'window', state.window);
    await Promise.all([
      loadOverview(),
      loadPerformance(),
      loadTraffic(),
      loadHealth(),
    ]);
  }

  function renderCards(s) {
    const total = s.by_class.reduce((a, c) => a + c.requests, 0);
    const c4 = (s.by_class.find(c => c.class === 4) || { requests: 0 }).requests;
    const c5 = (s.by_class.find(c => c.class === 5) || { requests: 0 }).requests;
    const c2 = (s.by_class.find(c => c.class === 2) || { requests: 0 }).requests;
    const c3 = (s.by_class.find(c => c.class === 3) || { requests: 0 }).requests;
    document.getElementById('cards').innerHTML = `
      <div class="card"><div class="label">Requests</div><div class="value">${fmt.int(total)}</div></div>
      <div class="card"><div class="label">Bytes out</div><div class="value">${fmt.bytes(s.bytes_total)}</div></div>
      <div class="card"><div class="label">2xx</div><div class="value">${fmt.int(c2)}</div></div>
      <div class="card"><div class="label">3xx</div><div class="value">${fmt.int(c3)}</div></div>
      <div class="card"><div class="label">4xx / 5xx</div><div class="value">${fmt.int(c4)} / ${fmt.int(c5)}</div></div>
    `;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';

  function niceNum(range, round) {
    if (range <= 0) return 1;
    const exp = Math.floor(Math.log10(range));
    const frac = range / 10 ** exp;
    let nice;
    if (round) {
      if (frac < 1.5) nice = 1;
      else if (frac < 3) nice = 2;
      else if (frac < 7) nice = 5;
      else nice = 10;
    } else {
      if (frac <= 1) nice = 1;
      else if (frac <= 2) nice = 2;
      else if (frac <= 5) nice = 5;
      else nice = 10;
    }
    return nice * 10 ** exp;
  }

  function pickYTicks(max, target, integer) {
    const t = Math.max(1, target | 0);
    if (!isFinite(max) || max <= 0) return { step: 1, niceMax: 1, ticks: [0, 1] };
    let step = niceNum(max / t, true);
    if (integer && step < 1) step = 1;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= niceMax + 1e-9; v += step) ticks.push(v);
    return { step, niceMax, ticks };
  }

  function pickXTickIndices(pointCount, target) {
    if (pointCount <= 0) return [];
    const want = Math.max(1, Math.min(target | 0, pointCount));
    if (want === 1 || pointCount === 1) return [0];
    const stride = (pointCount - 1) / (want - 1);
    const out = [];
    for (let k = 0; k < want; k++) out.push(Math.round(k * stride));
    return out;
  }

  function formatXTickLabel(win, ts, spanCrossesYear) {
    const d = new Date(ts * 1000);
    if (win === '1d') {
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    if (win === '7d') {
      const wd = d.toLocaleDateString([], { weekday: 'short' });
      const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${wd} ${hm}`;
    }
    if (win === '30d') {
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    if (win === '12m') {
      if (spanCrossesYear) {
        const m = d.toLocaleDateString([], { month: 'short' });
        const y = String(d.getFullYear()).slice(-2);
        return `${m} '${y}`;
      }
      return d.toLocaleDateString([], { month: 'short' });
    }
    return d.toISOString();
  }

  function formatTooltipTs(win, ts) {
    const d = new Date(ts * 1000);
    if (win === '1d') {
      const wd = d.toLocaleDateString([], { weekday: 'short' });
      const md = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${wd} ${md}, ${hm}`;
    }
    if (win === '7d' || win === '30d') {
      const wd = d.toLocaleDateString([], { weekday: 'short' });
      const md = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${wd} ${md}, ${hm}`;
    }
    if (win === '12m') {
      return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }
    return d.toISOString();
  }

  const CLASS_DIGITS = [1, 2, 3, 4, 5];

  function buildTipHtml(point, metric, win, series, opts) {
    opts = opts || {};
    const labelFmt = opts.valueFmt || (metric === 'bytes' ? fmt.bytes : fmt.int);
    const labelOf = opts.labelOf || (cd => `${cd}xx`);
    let total = 0;
    const rows = series.map(cd => {
      const m = point.by_class[cd];
      const v = (m && m[metric]) || 0;
      total += v;
      return `<div class="row"><span><span class="sw c${cd}"></span>${labelOf(cd)}</span>` +
             `<span>${labelFmt(v)}</span></div>`;
    }).join('');
    const totalRow = opts.showTotal === false ? '' :
      `<div class="row total"><span>Total</span><span>${labelFmt(total)}</span></div>`;
    return `<div class="ts">${formatTooltipTs(win, point.ts)}</div>` + rows + totalRow;
  }

  function renderChart(panelEl, points, metric, win, series, opts) {
    opts = opts || {};
    const svg = panelEl.querySelector('svg.chart');
    const tip = panelEl.querySelector('.chart-tip');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    // Drop handlers and hide the tip up-front, so a re-render (window switch,
    // resize) cannot leave a stale handler closed over old `points` or a
    // tooltip visible with old content.
    svg.onmousemove = null;
    svg.onmouseleave = null;
    tip.style.display = 'none';

    const W = svg.clientWidth, H = svg.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    if (!points.length) {
      const t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('class', 'chart-empty');
      t.setAttribute('x', W / 2);
      t.setAttribute('y', H / 2);
      t.setAttribute('dy', '0.35em');
      t.textContent = 'No data in this window';
      svg.appendChild(t);
      return;
    }

    const spanCrossesYear = points.length > 1 &&
      new Date(points[0].ts * 1000).getFullYear() !==
      new Date(points[points.length - 1].ts * 1000).getFullYear();

    const layout = { W, H, left: 48, right: 8, top: 8, bottom: 24 };
    layout.plotW = W - layout.left - layout.right;
    layout.plotH = H - layout.top - layout.bottom;

    const valueOf = (p, cd) => {
      const m = p.by_class[cd];
      return (m && m[metric]) || 0;
    };
    // Stacked (default): bands sum on top of each other, axis scales to the
    // per-point total. Overlaid (opts.stack === false): nested series like
    // p50/p95/p99 where each value already contains the smaller ones, so they
    // share a baseline and the axis scales to the largest single value.
    const stacked = opts.stack !== false;
    const totals = points.map(p => stacked
      ? series.reduce((s, cd) => s + valueOf(p, cd), 0)
      : Math.max(0, ...series.map(cd => valueOf(p, cd))));
    const rawMax = Math.max(1, ...totals);
    const { ticks: yTicks, niceMax: max } = pickYTicks(rawMax, 4, metric === 'requests' && stacked);
    const xStep = layout.plotW / Math.max(1, points.length - 1);
    const xAt = i => layout.left + xStep * i;
    const yAt = v => layout.top + layout.plotH - (v / max) * layout.plotH;

    // Drawn first so areas paint on top. Axis labels go in via textContent, so
    // they need a plain-text formatter (not `valueFmt`, which may emit HTML
    // entities like `&lt;1 ms` for tooltips).
    const labelFmt = opts.axisFmt || (metric === 'bytes' ? fmt.bytes : fmt.int);
    yTicks.forEach(v => {
      const y = yAt(v);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('class', 'chart-grid');
      line.setAttribute('x1', layout.left);
      line.setAttribute('x2', layout.left + layout.plotW);
      line.setAttribute('y1', y);
      line.setAttribute('y2', y);
      svg.appendChild(line);

      const label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('class', 'chart-tick-label');
      label.setAttribute('x', layout.left - 6);
      label.setAttribute('y', y + 4);
      label.setAttribute('text-anchor', 'end');
      label.textContent = labelFmt(v);
      svg.appendChild(label);
    });

    // Top edge of a band: cumulative sum up to and including `si` when stacked,
    // else the series' own value (shared baseline). Bottom edge: the sum below
    // `si` when stacked, else 0.
    const topAt = (p, si) => {
      if (!stacked) return valueOf(p, series[si]);
      let s = 0;
      for (let j = 0; j <= si; j++) s += valueOf(p, series[j]);
      return s;
    };
    const botAt = (p, si) => {
      if (!stacked) return 0;
      let s = 0;
      for (let j = 0; j < si; j++) s += valueOf(p, series[j]);
      return s;
    };
    // Overlaid bands share a baseline, so paint the largest first (back) and
    // smaller ones on top; stacked bands paint bottom-up as before.
    const drawOrder = series.map((_, si) => si);
    if (!stacked) drawOrder.reverse();
    drawOrder.forEach(si => {
      const cd = series[si];
      const path = document.createElementNS(SVG_NS, 'path');
      let d = '';
      points.forEach((p, i) => {
        d += (i === 0 ? 'M' : 'L') + xAt(i) + ',' + yAt(topAt(p, si));
      });
      for (let i = points.length - 1; i >= 0; i--) {
        d += 'L' + xAt(i) + ',' + yAt(botAt(points[i], si));
      }
      d += 'Z';
      path.setAttribute('d', d);
      path.setAttribute('fill', `var(--c${cd})`);
      svg.appendChild(path);
    });

    const xAxisY = layout.top + layout.plotH;
    const axisLine = document.createElementNS(SVG_NS, 'line');
    axisLine.setAttribute('class', 'chart-axis');
    axisLine.setAttribute('x1', layout.left);
    axisLine.setAttribute('x2', layout.left + layout.plotW);
    axisLine.setAttribute('y1', xAxisY);
    axisLine.setAttribute('y2', xAxisY);
    svg.appendChild(axisLine);

    const xTickIdx = pickXTickIndices(points.length, 6);
    xTickIdx.forEach(i => {
      const x = xAt(i);
      const tick = document.createElementNS(SVG_NS, 'line');
      tick.setAttribute('class', 'chart-axis');
      tick.setAttribute('x1', x);
      tick.setAttribute('x2', x);
      tick.setAttribute('y1', xAxisY);
      tick.setAttribute('y2', xAxisY + 4);
      svg.appendChild(tick);

      const label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('class', 'chart-tick-label');
      label.setAttribute('x', x);
      label.setAttribute('y', xAxisY + 16);
      label.setAttribute('text-anchor', 'middle');
      label.textContent = formatXTickLabel(win, points[i].ts, spanCrossesYear);
      svg.appendChild(label);
    });

    // Initially hidden via CSS.
    const guide = document.createElementNS(SVG_NS, 'line');
    guide.setAttribute('class', 'chart-guide');
    guide.setAttribute('y1', layout.top);
    guide.setAttribute('y2', layout.top + layout.plotH);
    svg.appendChild(guide);

    // .chart-tip lives inside .chart-wrap (position:relative), so its
    // CSS containing block is the wrap, not the panel — measure positions
    // against the wrap rect.
    const wrapEl = svg.parentNode;
    let lastHoverIdx = -1;
    svg.onmousemove = (e) => {
      const svgRect = svg.getBoundingClientRect();
      if (svgRect.width <= 0) return;
      const wrapRect = wrapEl.getBoundingClientRect();
      const mx = (e.clientX - svgRect.left) * (W / svgRect.width);
      const plotX = Math.max(0, Math.min(layout.plotW, mx - layout.left));
      const i = Math.round((plotX / layout.plotW) * (points.length - 1));
      const gx = xAt(i);
      guide.setAttribute('x1', gx);
      guide.setAttribute('x2', gx);
      guide.style.display = 'block';

      if (i !== lastHoverIdx) {
        tip.innerHTML = buildTipHtml(points[i], metric, win, series, opts);
        lastHoverIdx = i;
      }
      tip.style.display = 'block';

      const tipW = tip.offsetWidth;
      let left = e.clientX - wrapRect.left + 12;
      if (left + tipW > wrapRect.width - 4) {
        left = e.clientX - wrapRect.left - 12 - tipW;
      }
      tip.style.left = Math.max(4, left) + 'px';
      tip.style.top = '8px';
    };
    svg.onmouseleave = () => {
      guide.style.display = 'none';
      tip.style.display = 'none';
    };
  }

  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}

  function countryName(cc) {
    if (cc === 'ZZ') return 'Unknown';
    if (regionNames) { try { return regionNames.of(cc) || cc; } catch (e) {} }
    return cc;
  }
  function flagEmoji(cc) {
    if (cc.length !== 2 || cc === 'ZZ') return '';
    const cp = [...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65);
    return String.fromCodePoint(...cp) + ' ';
  }
  function classBar(byClass) {
    const total = CLASS_DIGITS.reduce((a, cd) =>
      a + ((byClass[cd] && byClass[cd].requests) || 0), 0);
    if (total <= 0) return '<div class="cbar"></div>';
    const segs = CLASS_DIGITS.map(cd => {
      const r = (byClass[cd] && byClass[cd].requests) || 0;
      if (r <= 0) return '';
      const pct = (r / total * 100).toFixed(2);
      return `<span class="c${cd}" style="width:${pct}%"></span>`;
    }).join('');
    return `<div class="cbar">${segs}</div>`;
  }

  function buildCountryTipHtml(byClass) {
    let total = 0;
    const rows = CLASS_DIGITS.map(cd => {
      const r = (byClass[cd] && byClass[cd].requests) || 0;
      if (r <= 0) return '';
      total += r;
      return `<div class="row"><span><span class="sw c${cd}"></span>${cd}xx</span>` +
             `<span>${fmt.int(r)}</span></div>`;
    }).join('');
    if (total <= 0) return '';
    return rows + `<div class="row total"><span>Total</span><span>${fmt.int(total)}</span></div>`;
  }

  let countryRows = [];

  function renderCountries(c) {
    const panel = document.getElementById('countries-panel');
    if (!c.enabled) { panel.hidden = true; return; }
    panel.hidden = false;
    countryRows = c.rows;
    document.getElementById('tip-country').style.display = 'none';
    const tbody = document.querySelector('#countries tbody');
    tbody.innerHTML = c.rows.map((r, i) => {
      const name = escapeHtml(`${flagEmoji(r.country)}${countryName(r.country)}`);
      return `<tr><td>${i + 1}</td><td>${name}</td>` +
             `<td class="num">${fmt.int(r.requests)}</td>` +
             `<td class="num">${fmt.bytes(r.bytes)}</td>` +
             `<td>${classBar(r.by_class)}</td></tr>`;
    }).join('');
  }

  function renderAssets(a) {
    const tbody = document.querySelector('#assets tbody');
    tbody.innerHTML = a.rows.map((r, i) => {
      const safePath = escapeHtml(r.path);
      // Only linkify same-origin absolute paths. Reject `//host` and `/\host`
      // (protocol-relative / backslash variant) which the browser would
      // resolve off-origin in a new tab.
      const linkable = r.path.length > 0
        && r.path.charCodeAt(0) === 0x2F
        && r.path.charCodeAt(1) !== 0x2F
        && r.path.charCodeAt(1) !== 0x5C
        && !r.path.endsWith('…');
      const pathCell = linkable
        ? `<a href="${safePath}" target="_blank" rel="noopener noreferrer">${safePath}</a>`
        : safePath;
      return `<tr><td>${i + 1}</td><td>${pathCell}</td>` +
             `<td class="num">${fmt.int(r.requests)}</td>` +
             `<td class="num">${fmt.bytes(r.bytes)}</td></tr>`;
    }).join('');
  }

  function renderHealth(h) {
    const ago = (v, unit, suf) => v == null ? 'never' : `${(v / unit) | 0}${suf} ago`;
    const parts = [];
    parts.push(`<div>Last flush: ${ago(h.last_flush_seconds_ago, 1, 's')} ·
       Last hour rollup: ${ago(h.last_hour_rollup_seconds_ago, 60, 'm')} ·
       Last day rollup: ${ago(h.last_day_rollup_seconds_ago, 3600, 'h')}</div>`);
    if (h.dropped_events_since_startup > 0)
      parts.push(`<div class="warn">⚠ ${fmt.int(h.dropped_events_since_startup)} events dropped since startup</div>`);
    if (h.sqlite_write_failures_since_startup > 0)
      parts.push(`<div class="warn">⚠ ${fmt.int(h.sqlite_write_failures_since_startup)} SQLite write failures since startup</div>`);
    if (h.failed_logins_since_startup > 0) {
      const recent = h.last_failed_login_seconds_ago !== null
        ? ` (most recent: ${(h.last_failed_login_seconds_ago / 60 | 0)}m ago)` : '';
      parts.push(`<div class="warn">⚠ ${fmt.int(h.failed_logins_since_startup)} failed login attempts since startup${recent}</div>`);
    }
    document.getElementById('health').innerHTML = parts.join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  document.getElementById('windows').addEventListener('click', e => {
    if (e.target.dataset.window) {
      state.window = e.target.dataset.window;
      localStorage.setItem('stats:window', state.window);
      loadAll();
    }
  });

  document.querySelector('#section-traffic .sort-controls').addEventListener('click', e => {
    if (e.target.dataset.sort) {
      state.sort = e.target.dataset.sort;
      localStorage.setItem('stats:sort', state.sort);
      loadTraffic();
    }
  });

  document.querySelector('#country-sort').addEventListener('click', e => {
    if (e.target.dataset.csort) {
      state.csort = e.target.dataset.csort;
      localStorage.setItem('stats:csort', state.csort);
      loadTraffic();
    }
  });

  (function wireCountryTip() {
    const tbody = document.querySelector('#countries tbody');
    const tip = document.getElementById('tip-country');
    tbody.addEventListener('mousemove', e => {
      const bar = e.target.closest('.cbar');
      const tr = e.target.closest('tr');
      if (!bar || !tr) { tip.style.display = 'none'; return; }
      const idx = Array.prototype.indexOf.call(tbody.children, tr);
      const row = countryRows[idx];
      if (!row) { tip.style.display = 'none'; return; }
      const html = buildCountryTipHtml(row.by_class);
      if (!html) { tip.style.display = 'none'; return; }
      tip.innerHTML = html;
      tip.style.display = 'block';
      const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
      let left = e.clientX + 14;
      if (left + tipW > window.innerWidth - 4) left = e.clientX - 14 - tipW;
      let top = e.clientY + 14;
      if (top + tipH > window.innerHeight - 4) top = e.clientY - 14 - tipH;
      tip.style.left = Math.max(4, left) + 'px';
      tip.style.top = Math.max(4, top) + 'px';
    });
    tbody.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  })();

  window.addEventListener('load', () => loadAll());

  let chartRafPending = false;
  function scheduleChartRedraw() {
    if (chartRafPending) return;
    chartRafPending = true;
    requestAnimationFrame(() => {
      chartRafPending = false;
      drawCharts();
    });
  }
  window.addEventListener('resize', () => {
    scheduleChartRedraw();
    if (lastLatency) schedulePerfRedraw();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    scheduleChartRedraw();
    if (lastLatency) schedulePerfRedraw();
  });
  </script>
</body>
</html>
