<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serve · stats · login</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
           max-width: 400px; margin: 8em auto; padding: 1.5em;
           background: #fafafa; color: #222; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #ddd; }
      input { background: #2a2a2a; color: #fff; border-color: #444; }
    }
    h1 { font-size: 1.2em; margin-top: 0; }
    label { display: block; margin-top: 0.8em; font-size: 0.9em; }
    input { width: 100%; padding: 0.5em; font: inherit;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 1.2em; padding: 0.5em 1em; font: inherit;
             border: 1px solid #444; background: #444; color: #fff;
             border-radius: 4px; cursor: pointer; }
    .err { color: #c33; margin: 0.6em 0; }
  </style>
</head>
<body>
  <h1>serve · stats · login</h1>
  <!--ERROR-->
  <form method="post" action="{{PREFIX}}/login">
    <input type="hidden" name="csrf" value="{{CSRF}}">
    <label>Password<input name="password" type="password" autocomplete="current-password" autofocus required></label>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
