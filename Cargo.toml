[package]
name = "serve"
authors = ["Serhiy Barhamon"]
description = "A simple tool to serve static files from a directory."
rust-version = "1.89.0"                                               # smol_str 0.3.6 requires 1.89
repository = "https://github.com/Lurk/serve.git"
license = "MIT"
keywords = ["http", "server", "static", "tls", "proxy"]
categories = ["web-programming::http-server"]
version = "0.4.0"
edition = "2024"


[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
	"tracing",
	"serde",
] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = [
	"fs",
	"trace",
	"compression-full",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-log = "0.2.0"
tracing-appender = "0.2.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.18"
futures-util = { version = "0.3.32", default-features = false, features = [
	"sink",
] }
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = [
	"client-legacy",
	"http1",
	"tokio",
] }
http-body-util = "0.1.3"
notify = "8.2.0"
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
tokio-tungstenite = "0.29.0"
toml = "1.1.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
argon2 = { version = "0.5.3", features = ["std"] }
subtle = "2.6.1"
rand = "0.10.1"
smol_str = { version = "0.3.6", default-features = false }
base64 = "0.22.1"
http-body = "1.0.1"
bytes = "1.11.1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
x509-parser = "0.18.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
result_large_err = "allow"

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }
rcgen = "0.14.8"
reqwest = { version = "0.13.3", default-features = false, features = [
	"cookies",
	"form",
	"json",
	"rustls",
] }
scraper = "0.27.0"
